[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hoard-local"
version = "0.7.4.1"
description = "Local Telegram archive with offline and loopback-interactive catalogs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "telethon>=1.45,<2",
  "cryptg>=0.6,<0.7",
  "rich>=13.7,<15",
  "jsonschema>=4.23,<5",
  "textual>=8.2.8,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[project.scripts]
hoard = "hoard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hoard"]
artifacts = ["src/hoard/templates/**", "src/hoard/tui/theme.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
